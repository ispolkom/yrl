[package]
name = "yrl"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "YRL v0.1: direct connection, Noise IK, authorized keys, structured exec"

[lib]
name = "yrl"
path = "src/lib.rs"

[[bin]]
name = "yrl-relay"
path = "src/bin/yrl_relay.rs"

[[bin]]
name = "yrld"
path = "src/bin/yrld.rs"

[[bin]]
name = "yrl"
path = "src/bin/yrl.rs"

[[bin]]
name = "yrl-audit"
path = "src/bin/yrl_audit.rs"

[[bin]]
name = "yrl-release"
path = "src/bin/yrl_release.rs"

[[bin]]
name = "yrl-update"
path = "src/bin/yrl_update.rs"

[dependencies]
snow = "0.9"
tokio = { version = "1.40", features = ["full"] }
hex = "0.4"
anyhow = "1.0"
argon2 = "0.5"
libc = "0.2"
blake3 = "1.5"
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
zeroize = "1"
clatter = { version = "2.3.0", default-features = false, features = ["std", "getrandom", "use-chacha20poly1305", "use-blake2", "use-rust-crypto-ml-kem"], optional = true }
opaque-ke = { version = "4.0.1", default-features = false, features = ["std", "ristretto255", "argon2"], optional = true }
sha2 = { version = "0.10", optional = true }
ml-dsa = { version = "0.1.2", default-features = false, features = ["alloc", "getrandom", "zeroize"], optional = true }
fido2-rs = { version = "0.6.0", optional = true }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
tss-esapi = { version = "=7.7.0", optional = true }
chacha20poly1305 = { version = "0.10", features = ["std"], optional = true }

[features]
default = []
crypto-profiles = []
pq-hybrid = ["crypto-profiles", "dep:clatter"]
opaque-rfc9807 = ["dep:opaque-ke", "dep:sha2"]
hybrid-signatures = ["dep:ml-dsa"]
fido2 = ["dep:fido2-rs", "dep:p256", "dep:sha2"]
tpm2 = ["dep:tss-esapi", "dep:chacha20poly1305", "dep:p256"]

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.40", features = ["test-util"] }
