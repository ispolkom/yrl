[package]
name = "yrl_link"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "YRL: the minimum copied from the YANDI node to establish a link (identity, session encryption, WS/TLS transport, pairing)"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
rand = "0.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = "2.0"
aes-gcm = "0.10"
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
tracing = "0.1"
dirs = "5.0"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tungstenite = "0.24"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = "0.26"
rcgen = "0.13"
futures-util = "0.3"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
base64 = "0.22.1"
argon2 = "0.5"
hkdf = "0.12"
chacha20poly1305 = "0.10"
key_root = { path = "../key_root" }
zeroize = "1"
once_cell = "1.20"
url = "2.5"

[dev-dependencies]
tempfile = "3"
