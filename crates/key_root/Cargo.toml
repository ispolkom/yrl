[package]
name = "key_root"
version = "0.1.0"
edition = "2021"
description = "COPY of the YANDI key root (library only: root key, device/recovery wrappers, identity formats, load policy)"

[lib]
name = "key_root"
path = "src/lib.rs"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = "1"
libc = "0.2.180"
base64 = "0.22.1"

[dev-dependencies]
tempfile = "3"
